<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Job Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f6fb;
            color: #18213d;
            min-height: 100vh;
            padding: 28px;
        }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 16px 50px rgba(31, 41, 72, 0.10);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(120deg, #172554 0%, #4338ca 52%, #7c3aed 100%);
            color: white;
            padding: 42px 44px 38px;
            text-align: left;
            position: relative;
        }
        .header::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -90px;
            top: -130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: 2.65rem;
            line-height: 1.1;
            margin: 0 0 10px;
            font-weight: 800;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        .header p {
            opacity: 0.88;
            margin: 0;
            font-size: 1.02rem;
            position: relative;
            z-index: 1;
        }
        .search-form {
            margin: 28px 32px 34px;
            padding: 30px;
            background: #ffffff;
            border: 1px solid #e6e9f2;
            border-radius: 20px;
            box-shadow: 0 10px 32px rgba(35, 43, 77, 0.07);
        }
        .form-group {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 650;
            color: #273252;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px 18px;
            border: 1px solid #dfe3ee;
            border-radius: 11px;
            font-size: 16px;
            background: #ffffff;
            color: #202a44;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }
        .search-btn {
            background: linear-gradient(90deg, #5b6ff0 0%, #6739df 52%, #7c2dca 100%);
            color: white;
            padding: 0 30px;
            height: 56px;
            border: none;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 750;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 22px rgba(103, 57, 223, 0.22);
        }
        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 26px rgba(103, 57, 223, 0.28);
        }
        .search-btn:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
        }
        .results {
            padding: 0 32px 42px;
            display: none;
        }
        .job-card {
            background: #ffffff;
            border: 1px solid #e7eaf2;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(35, 43, 77, 0.09);
        }
        .job-title {
            font-size: 1.35rem;
            font-weight: 750;
            color: #18213d;
            margin-bottom: 8px;
        }
        .job-company {
            color: #5b5ce2;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .job-details {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .job-detail {
            display: flex;
            align-items: center;
            color: #667085;
            font-size: 0.9rem;
        }
        .job-detail span {
            margin-right: 8px;
        }
        .apply-btn {
            background: #111827;
            color: white;
            padding: 11px 19px;
            text-decoration: none;
            border-radius: 9px;
            display: inline-block;
            transition: transform 0.2s, background 0.2s;
        }
        .apply-btn:hover {
            background: #293548;
            transform: translateY(-1px);
        }
        .loading { 
            text-align: center; 
            padding: 40px; 
            color: #6c757d; 
        }
        .spinner { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #667eea; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .no-results { 
            text-align: center; 
            padding: 40px; 
            color: #6c757d; 
        }
        .source-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
        }
        .source-badge.linkedin {
            background: linear-gradient(135deg, #0077b5, #005885);
        }

        
        /* AI Matching */

        .ai-match {
            margin: 18px 0;
            padding: 16px;
            background: linear-gradient(135deg, #f5f7ff, #f8f5ff);
            border: 1px solid #e1e5ff;
            border-radius: 10px;
        }

        .ai-match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .ai-match-title {
            font-size: 1.05em;
            font-weight: 700;
            color: #2c3e50;
        }

        .match-score {
            font-size: 1.3em;
            font-weight: 800;
            color: #667eea;
        }

        .match-bar {
            width: 100%;
            height: 9px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .match-bar-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s ease;
        }

        .match-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .match-metric {
            background: white;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid #eee;
        }

        .metric-label {
            display: block;
            font-size: 0.8em;
            color: #6c757d;
            margin-bottom: 3px;
        }

        .metric-value {
            font-weight: 700;
            color: #2c3e50;
        }

        .skills-section {
            margin-top: 14px;
        }

        .skills-title {
            font-size: 0.9em;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .skill-tag {
            display: inline-block;
            padding: 5px 9px;
            margin: 3px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .skill-match {
            background: #e8f7ee;
            color: #218838;
        }

        .skill-missing {
            background: #fff1f1;
            color: #c0392b;
        }

        .insufficient-match {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            background: #fff8e6;
            color: #856404;
            font-size: 0.9em;
        }
        /* Resume Upload */

        .resume-upload {
            padding: 30px 32px 0;
            background: #ffffff;
        }

        .resume-upload-card {
            padding: 26px 30px;
            border: 1px dashed #cbd5ff;
            border-radius: 17px;
            background: linear-gradient(180deg, #fbfcff 0%, #f7f8ff 100%);
            text-align: left;
        }
        .job-description {
            margin: 18px 0;
            padding: 16px;
            background: #f8f9fa;
            border: 1px solid #eef0f3;
            border-radius: 8px;
        }

        .description-title {
            font-size: 0.95em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .description-text {
            font-size: 0.9em;
            line-height: 1.6;
            color: #5f6b7a;
        }

        .resume-upload-card h3 {
            color: #18213d;
            margin-bottom: 7px;
        }

        .resume-upload-card p {
            color: #69758f;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .filter-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin-top: 24px;
            margin-bottom: 24px;
            padding-top: 22px;
            border-top: 1px solid #e8ebf3;
        }

        .filter-group {
            padding: 0 18px;
            border-right: 1px solid #e5e8f0;
            min-width: 0;
        }

        .filter-group:first-child {
            padding-left: 0;
        }

        .filter-group:last-child {
            padding-right: 0;
            border-right: none;
        }

        .filter-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.82rem;
            font-weight: 650;
            color: #69758f;
            margin-bottom: 9px;
        }

        .filter-group select {
            width: 100%;
            height: 48px;
            box-sizing: border-box;
            padding: 0 36px 0 13px;
            border: 1px solid #dfe3ed;
            border-radius: 9px;
            background: #ffffff;
            color: #273252;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-group select:hover {
            border-color: #bfc6d9;
        }

        .filter-group select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.09);
        }

        @media (max-width: 900px) {
            .container {
                max-width: 100%;
            }

            .filter-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                row-gap: 20px;
            }

            .filter-group:nth-child(2) {
                border-right: none;
            }

            .filter-group:nth-child(3) {
                padding-left: 0;
            }

            .filter-group:nth-child(4) {
                padding-right: 0;
            }

            .job-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 30px 24px;
            }

            .header h1 {
                font-size: 2.1rem;
            }

            .resume-upload,
            .results {
                padding-left: 18px;
                padding-right: 18px;
            }

            .search-form {
                margin: 18px;
                padding: 22px;
            }

            .filter-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .filter-group,
            .filter-group:nth-child(3),
            .filter-group:nth-child(4) {
                padding: 0;
                border-right: none;
            }

            .job-details {
                grid-template-columns: 1fr;
            }
        }
        .resume-upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .resume-file-input {
            max-width: 350px;
            padding: 10px;
            background: white;
        }

        .upload-btn {
            background: linear-gradient(90deg, #5b6ff0, #6d3fe0);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(103, 57, 223, 0.18);
        }

        .upload-btn:hover {
            background: linear-gradient(90deg, #5266e9, #6335d5);
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .upload-status {
            margin-top: 12px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .upload-success {
            color: #218838;
        }

        .upload-error {
            color: #c0392b;
        }

        @media (max-width: 600px) {
            .resume-upload-row {
                flex-direction: column;
            }

            .resume-file-input {
                max-width: 100%;
            }
        }
        .why-match-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .why-match-list {
            margin: 10px 0 0 0;
            padding-left: 22px;
            color: #475569;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .why-match-list li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Job Search</h1>
            <p>AI-powered job search and personalized resume matching</p>
        </div>
        <!-- =====================================================
     RESUME UPLOAD
     ===================================================== -->

<div class="resume-upload">

    <div class="resume-upload-card">

        <h3>📄 Upload Your Resume</h3>

        <p>
            Upload a PDF or DOCX resume to get personalized
            AI-powered job matching.
        </p>

        <div class="resume-upload-row">

            <input
                type="file"
                id="resumeFile"
                class="resume-file-input"
                accept=".pdf,.docx"
            >

            <button
                type="button"
                id="uploadResumeBtn"
                class="upload-btn"
            >
                📤 Upload Resume
            </button>

        </div>

        <div
            id="uploadStatus"
            class="upload-status"
        ></div>

    </div>

</div>
       <div class="search-form">
    <form id="searchForm">
        <div class="form-group">
            <label for="smartQuery">
                🔎 Describe the job you're looking for
            </label>

            <input
                type="text"
                id="smartQuery"
                placeholder="e.g., Find Python developer jobs in Bangalore"
                required
            >

            <small style="display:block; margin-top:8px; color:#6c757d;">
                Search naturally — mention role, skills, location, experience, or recency.
            </small>
            <div class="filter-row">

                <div class="filter-group">
                    <label for="filterLocation">📍 Location</label>
                    <select id="filterLocation">
                        <option value="">Any Location</option>
                        <option value="India">India</option>
                        <option value="Delhi">Delhi / NCR</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Pune">Pune</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Remote">Remote</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterExperience">🎓 Experience</label>
                    <select id="filterExperience">
                        <option value="">Any Experience</option>
                        <option value="entry-level">Entry Level</option>
                        <option value="junior">Junior</option>
                        <option value="mid">Mid Level</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterEmployment">💼 Employment Type</label>
                    <select id="filterEmployment">
                        <option value="">Any Type</option>
                        <option value="FULL_TIME">Full Time</option>
                        <option value="PART_TIME">Part Time</option>
                        <option value="CONTRACT">Contract</option>
                        <option value="INTERNSHIP">Internship</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterRecency">📅 Posted Within</label>
                    <select id="filterRecency">
                        <option value="">Any Time</option>
                        <option value="1">Last 24 hours</option>
                        <option value="7">Last 7 days</option>
                        <option value="14">Last 14 days</option>
                        <option value="30">Last 30 days</option>
                    </select>
                </div>

            </div>
        </div>

        <button type="submit" class="search-btn" id="searchBtn">
            🚀 Search Jobs
        </button>
    </form>
</div> 
<div id="results" class="results">
    <div id="jobsList"></div>
</div>
    <script>
        // =========================================================
        // RESUME UPLOAD
        // =========================================================

        document.getElementById('uploadResumeBtn').addEventListener(
            'click',
            async () => {

                const fileInput =
                    document.getElementById('resumeFile');

                const uploadBtn =
                    document.getElementById('uploadResumeBtn');

                const uploadStatus =
                    document.getElementById('uploadStatus');

                const file = fileInput.files[0];

                // ---------------------------------------------------------
                // Validate file selection
                // ---------------------------------------------------------

                if (!file) {

                    uploadStatus.textContent =
                        'Please select a PDF or DOCX resume first.';

                    uploadStatus.className =
                        'upload-status upload-error';

                    return;
                }

                // ---------------------------------------------------------
                // Validate extension
                // ---------------------------------------------------------

                const filename = file.name.toLowerCase();

                if (
                    !filename.endsWith('.pdf') &&
                    !filename.endsWith('.docx')
                ) {

                    uploadStatus.textContent =
                        'Only PDF and DOCX resumes are supported.';

                    uploadStatus.className =
                        'upload-status upload-error';

                    return;
                }

                // ---------------------------------------------------------
                // Prepare upload
                // ---------------------------------------------------------

                const formData = new FormData();

                formData.append('resume', file);

                uploadBtn.disabled = true;
                uploadBtn.textContent = '📤 Uploading...';

                uploadStatus.textContent =
                    'Uploading and processing your resume...';

                uploadStatus.className =
                    'upload-status';

                try {

                    const response = await fetch(
                        '/upload-resume',
                        {
                            method: 'POST',
                            body: formData
                        }
                    );

                    const data = await response.json();

                    if (data.success) {

                        uploadStatus.textContent =
                            `✅ ${data.filename} uploaded successfully. ` +
                            `${data.text_length} characters extracted.`;

                        uploadStatus.className =
                            'upload-status upload-success';

                    } else {

                        uploadStatus.textContent =
                            `❌ ${data.error || 'Resume upload failed.'}`;

                        uploadStatus.className =
                            'upload-status upload-error';
                    }

                } catch (error) {

                    uploadStatus.textContent =
                        `❌ Upload failed: ${error.message}`;

                    uploadStatus.className =
                        'upload-status upload-error';

                } finally {

                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '📤 Upload Resume';

                }
            }
        );
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();

            const query = document.getElementById('smartQuery').value.trim();

            if (!query) {
                alert('Please describe the job you are looking for');
                return;
            }

            // Read structured filters
            const location = document.getElementById('filterLocation').value;
            const experience = document.getElementById('filterExperience').value;
            const employmentType = document.getElementById('filterEmployment').value;
            const recency = document.getElementById('filterRecency').value;

            // Show loading
            showLoading();

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        filter_location: location,
                        filter_experience: experience,
                        filter_employment: employmentType,
                        filter_recency: recency
                    })
                });

                const data = await response.json();

                if (data.success) {

                    displayParsedQuery(data.parsed_query);

                    displayJobs(data.jobs);

                } else {

                    showError(data.error || 'Search failed');

                }

            } catch (error) {

                showError('Network error: ' + error.message);

            }
        });
        
        function showLoading() {
            const results = document.getElementById('results');
            const jobsList = document.getElementById('jobsList');
            
            results.style.display = 'block';
            jobsList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching for jobs...</p>
                </div>
            `;
            
            // Disable search button
            const searchBtn = document.getElementById('searchBtn');
            searchBtn.disabled = true;
            searchBtn.textContent = '🔍 Searching...';
        }
        function displayParsedQuery(parsed) {

            if (!parsed) {
                return;
            }

            const jobsList = document.getElementById('jobsList');

            const skills =
                parsed.skills && parsed.skills.length > 0
                    ? parsed.skills.join(', ')
                    : 'None detected';

            const experience =
                parsed.experience_level || 'Any';

            const recency =
                parsed.recency_days !== undefined
                    ? `${parsed.recency_days} days`
                    : '30 days';

            const summary = document.createElement('div');

            summary.className = 'parsed-query';

            summary.innerHTML = `
                <div style="
                    margin-bottom: 20px;
                    padding: 15px;
                    background: #f5f7ff;
                    border: 1px solid #e1e5ff;
                    border-radius: 10px;
                ">
                    <strong>🧠 Search understood as:</strong>

                    <div style="
                        margin-top: 8px;
                        color: #2c3e50;
                        line-height: 1.6;
                    ">
                        <div>
                            💼 <strong>Role:</strong>
                            ${escapeHtml(parsed.job_title || 'Any')}
                        </div>

                        <div>
                            📍 <strong>Location:</strong>
                            ${escapeHtml(parsed.location || 'India')}
                        </div>

                        <div>
                            🛠 <strong>Skills:</strong>
                            ${escapeHtml(skills)}
                        </div>

                        <div>
                            🎓 <strong>Experience:</strong>
                            ${escapeHtml(experience)}
                        </div>

                        <div>
                            📅 <strong>Recency:</strong>
                            ${escapeHtml(recency)}
                        </div>
                    </div>
                </div>
            `;

            jobsList.prepend(summary);
        }
        function displayJobs(jobs) {
            const jobsList = document.getElementById('jobsList');
            const searchBtn = document.getElementById('searchBtn');

            // Re-enable search button
            searchBtn.disabled = false;
            searchBtn.textContent = '🚀 Search Jobs';

            if (jobs.length === 0) {
                jobsList.innerHTML = `
                    <div class="no-results">
                        <h3>No jobs found</h3>
                        <p>Try different keywords or location</p>
                    </div>
                `;
                return;
            }

            let html = `<h2>Found ${jobs.length} Jobs</h2>`;

            jobs.forEach((job, index) => {

                const score =
                    job.overall_match_score ??
                    job.score ??
                    null;

                let aiSection = '';

                if (score !== null && score !== undefined) {

                    const semanticValue =
                        job.semantic_score ??
                        job.semantic_match ??
                        job.semantic_similarity ??
                        null;

                    const skillValue =
                        job.skill_score ??
                        job.skill_match ??
                        job.skill_match_score ??
                        null;

                    const semanticScore =
                        semanticValue !== null
                            ? `${Number(semanticValue).toFixed(1)}%`
                            : 'N/A';

                    const skillScore =
                        skillValue !== null
                            ? `${Number(skillValue).toFixed(1)}%`
                            : 'N/A';

                    const matchedSkills = job.matched_skills || [];
                    const missingSkills = job.missing_skills || [];

                    let matchedHTML = '';

                    if (matchedSkills.length > 0) {
                        matchedHTML = `
                            <div class="skills-section">
                                <div class="skills-title">
                                    ✅ Skills you match
                                </div>

                                ${matchedSkills.map(skill => `
                                    <span class="skill-tag skill-match">
                                        ${escapeHtml(skill)}
                                    </span>
                                `).join('')}
                            </div>
                        `;
                    }
                                        let missingHTML = '';

                    if (missingSkills.length > 0) {
                        missingHTML = `
                            <div class="skills-section">
                                <div class="skills-title">
                                    📚 Skills to develop
                                </div>

                                ${missingSkills.map(skill => `
                                    <span class="skill-tag skill-missing">
                                        ${escapeHtml(skill)}
                                    </span>
                                `).join('')}
                            </div>
                        `;
                    }
                    let whyMatchHTML = '';

                    const whyMatch = job.why_this_matches;

                    if (whyMatch && whyMatch.reasons && whyMatch.reasons.length > 0) {
                        whyMatchHTML = `
                            <div class="why-match-section">
                                <div class="skills-title">
                                    💡 Why this match?
                                </div>

                                <ul class="why-match-list">
                                    ${whyMatch.reasons.map(reason => `
                                        <li>
                                            ${escapeHtml(reason)}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    }

                    aiSection = `
                        <div class="ai-match">

                            <div class="ai-match-header">
                                <div class="ai-match-title">
                                    🏆 Overall Match
                                    <div style="
                                        font-size: 0.75em;
                                        color: #667eea;
                                        margin-top: 3px;
                                    ">
                                        ${getOverallMatchLabel(score)}
                                    </div>
                                </div>

                                <div class="match-score">
                                    ${Number(score).toFixed(1)}%
                                </div>
                            </div>

                            <div class="match-bar">
                                <div
                                    class="match-bar-fill"
                                    style="width: ${Math.min(Number(score), 100)}%"
                                ></div>
                            </div>

                 <div class="match-metrics">

    <div class="match-metric">
        <span class="metric-label">
            🧠 Resume Match
        </span>

        <span class="metric-value">
            ${job.resume_match_score !== null &&
              job.resume_match_score !== undefined
                ? `${Number(job.resume_match_score).toFixed(1)}%`
                : 'N/A'}
        </span>
    </div>

    <div class="match-metric">
        <span class="metric-label">
            🔎 Query Relevance
        </span>

        <span class="metric-value">
            ${job.query_relevance_score !== null &&
              job.query_relevance_score !== undefined
                ? `${Number(job.query_relevance_score).toFixed(1)}%`
                : 'N/A'}
        </span>
    </div>

    <div class="match-metric">
        <span class="metric-label">
            🕒 Freshness
        </span>

        <span class="metric-value">
            ${job.freshness_score !== null &&
              job.freshness_score !== undefined
                ? `${Number(job.freshness_score).toFixed(1)}%`
                : 'N/A'}
        </span>
    </div>

    <div class="match-metric">
        <span class="metric-label">
            ⚖️ Ranking Weight
        </span>

        <span class="metric-value">
            50% · 30% · 20%
        </span>
    </div>

</div>

                            ${matchedHTML}
                            ${missingHTML}
                            ${whyMatchHTML}
                            ${job.match_reasons && job.match_reasons.length > 0 ? `
                                <div class="skills-section">
                                    <div class="skills-title">
                                        💡 Why this matches you
                                    </div>

                                    ${job.match_reasons.map(reason => `
                                        <div style="
                                            margin: 5px 0;
                                            color: #218838;
                                            font-size: 0.88em;
                                        ">
                                            ✓ ${escapeHtml(reason)}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            ${job.gap_reasons && job.gap_reasons.length > 0 ? `
                                <div class="skills-section">
                                    <div class="skills-title">
                                        📚 Potential skill gaps
                                    </div>

                                    ${job.gap_reasons.map(reason => `
                                        <div style="
                                            margin: 5px 0;
                                            color: #c0392b;
                                            font-size: 0.88em;
                                        ">
                                            ⚠ ${escapeHtml(reason)}
                                        </div>
                                    `).join('')}
                                </div>
` : ''}

                        </div>
                    `;

               } else {

                    aiSection = `
                        <div class="ai-match">

                            <div class="ai-match-header">
                                <div class="ai-match-title">
                                    🏆 Overall Match
                                </div>

                                <div class="match-score">
                                    N/A
                                </div>
                            </div>

                            <div class="insufficient-match">
                                ⚠️ AI matching data was not returned for this job.
                            </div>

                        </div>
                    `;
                }

                html += `
                    <div class="job-card">

                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 10px;
                        ">

                            <div class="job-title">
                                ${escapeHtml(job.title || 'Job Title')}
                            </div>

                            <div class="source-badge linkedin">
                                💼 LinkedIn
                            </div>

                        </div>

                        <div class="job-company">
                            🏢 ${escapeHtml(job.company || 'Company')}
                        </div>

                        <div class="job-details">

                            <div class="job-detail">
                                <span>📍</span>
                                ${escapeHtml(job.location || 'Location not specified')}
                            </div>

                            <div class="job-detail">
                                <span>💼</span>
                                ${formatEmploymentType(job.employment_type)}
                            </div>

                            <div class="job-detail">
                                <span>🎓</span>
                                ${escapeHtml(job.experience || 'Not specified')}
                            </div>

                            <div class="job-detail">
                                <span>💰</span>
                                ${escapeHtml(job.salary || 'Not disclosed')}
                            </div>

                            <div class="job-detail">
                                <span>📅</span>
                                ${job.posted_date
                                    ? `Posted ${escapeHtml(job.posted_date)}`
                                    : 'Posting date unavailable'}
                            </div>

                        </div>

                        ${aiSection}

                     ${
                        job.description
                        ? `
                            <div class="job-description">
                                <div class="description-title">
                                    📋 Job Description
                                </div>

                                <div class="description-text">
                                    ${escapeHtml(
                                        job.description.substring(0, 700)
                                    )}${job.description.length > 700 ? '...' : ''}
                                </div>
                            </div>
                        `
                        : ''
                    }   

                        <a
                            href="${job.apply_url || '#'}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="apply-btn"
                        >
                            Apply Now →
                        </a>

                    </div>
                `;
            });

            jobsList.innerHTML = html;
        }
        function getOverallMatchLabel(score) {
            const value = Number(score);

            if (value >= 80) {
                return 'Excellent Match';
            }

            if (value >= 65) {
                return 'Strong Match';
            }

            if (value >= 50) {
                return 'Good Match';
            }

            if (value >= 35) {
                return 'Moderate Match';
            }

            return 'Low Match';
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        function getSourceIcon(source) {
            return '💼';
        }
        function formatEmploymentType(type) {
            if (!type) {
                return 'Not specified';
            }

            const formatted = String(type)
                .toLowerCase()
                .replace(/_/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());

            return formatted;
        }
      
        
        function showError(message) {
            const jobsList = document.getElementById('jobsList');
            const searchBtn = document.getElementById('searchBtn');
            
            // Re-enable search button
            searchBtn.disabled = false;
            searchBtn.textContent = '🚀 Search Jobs';
            
            jobsList.innerHTML = `
                <div class="no-results">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
